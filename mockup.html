<title>ComHost</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@600;700;800;900&display=swap">
<style>
/* Layout: satu kolom ala aplikasi HP (maks 480px), header lengket di atas, tab bar melayang di bawah, lembar naik dari bawah. Token mengikuti Jadwalin/Loyalin. */
:root {
  --p-light: #0B7F6E; --p-dark: #5FD4BD;
  --h-sit: #3B82F0; --h-tin: #F0883A; --h-kom: #9466EC;
  --ok: #22A05A; --bad: #E0505A; --warn: #E09A12; --on-ok: #FFFFFF;
  --primary: var(--p-light); --on-primary: #FFFFFF;
  --bg: color-mix(in oklab, var(--p-light) 6%, #F7F8F8);
  --surface: #FFFFFF;
  --surface-2: color-mix(in oklab, var(--p-light) 7%, #F6F7F7);
  --line: color-mix(in oklab, var(--p-light) 12%, #E5E8E7);
  --ink: color-mix(in oklab, var(--p-light) 22%, #141817);
  --ink-2: color-mix(in oklab, var(--p-light) 16%, #56615F);
  --ink-3: color-mix(in oklab, var(--p-light) 12%, #8E9997);
  --scrim: rgb(10 20 18 / .38);
  --shadow-soft: 0 1px 2px rgb(16 32 28 / .05), 0 10px 28px -10px rgb(16 32 28 / .18);
  --shadow-big: 0 2px 6px rgb(16 32 28 / .06), 0 30px 60px -24px rgb(16 32 28 / .32);
  --shadow-pop: 0 12px 24px -8px color-mix(in oklab, var(--primary) 55%, transparent);
  --sw-mint: #0B7F6E; --sw-lavender: #6A4FD8; --sw-peach: #C24E28;
  --font-display: 'Fredoka', 'Nunito', ui-rounded, 'Segoe UI', system-ui, sans-serif;
  --font-body: 'Nunito', ui-rounded, 'Segoe UI', system-ui, sans-serif;
  --spring: cubic-bezier(.34, 1.56, .64, 1);
}
:root[data-palette="lavender"] { --p-light: #6A4FD8; --p-dark: #B4A3FF; }
:root[data-palette="peach"] { --p-light: #C24E28; --p-dark: #FF9E7A; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --primary: var(--p-dark); --on-primary: #0E1312;
    --bg: color-mix(in oklab, var(--p-dark) 5%, #0F1212);
    --surface: color-mix(in oklab, var(--p-dark) 7%, #171B1B);
    --surface-2: color-mix(in oklab, var(--p-dark) 11%, #1E2323);
    --line: color-mix(in oklab, var(--p-dark) 14%, #2A302F);
    --ink: color-mix(in oklab, var(--p-dark) 10%, #EEF2F1);
    --ink-2: color-mix(in oklab, var(--p-dark) 12%, #A9B3B1);
    --ink-3: color-mix(in oklab, var(--p-dark) 12%, #737E7C);
    --scrim: rgb(0 0 0 / .55);
    --shadow-soft: 0 1px 2px rgb(0 0 0 / .4), 0 12px 30px -12px rgb(0 0 0 / .7);
    --shadow-big: 0 2px 6px rgb(0 0 0 / .4), 0 30px 60px -24px rgb(0 0 0 / .8);
    --sw-mint: #5FD4BD; --sw-lavender: #B4A3FF; --sw-peach: #FF9E7A;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --primary: var(--p-dark); --on-primary: #0E1312;
  --bg: color-mix(in oklab, var(--p-dark) 5%, #0F1212);
  --surface: color-mix(in oklab, var(--p-dark) 7%, #171B1B);
  --surface-2: color-mix(in oklab, var(--p-dark) 11%, #1E2323);
  --line: color-mix(in oklab, var(--p-dark) 14%, #2A302F);
  --ink: color-mix(in oklab, var(--p-dark) 10%, #EEF2F1);
  --ink-2: color-mix(in oklab, var(--p-dark) 12%, #A9B3B1);
  --ink-3: color-mix(in oklab, var(--p-dark) 12%, #737E7C);
  --scrim: rgb(0 0 0 / .55);
  --shadow-soft: 0 1px 2px rgb(0 0 0 / .4), 0 12px 30px -12px rgb(0 0 0 / .7);
  --shadow-big: 0 2px 6px rgb(0 0 0 / .4), 0 30px 60px -24px rgb(0 0 0 / .8);
  --sw-mint: #5FD4BD; --sw-lavender: #B4A3FF; --sw-peach: #FF9E7A;
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 600 15px/1.45 var(--font-body); -webkit-tap-highlight-color: transparent; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 25; background: var(--bg); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid color-mix(in oklab, var(--primary) 55%, transparent); outline-offset: 2px; }
.i { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; flex: none; }

.app { max-width: 480px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 calc(112px + env(safe-area-inset-bottom, 0px)); }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); display: flex; align-items: center; gap: 10px; padding-block: 14px 10px; }
.logo { display: flex; align-items: center; gap: 9px; font: 600 22px/1 var(--font-display); }
.mark { width: 36px; height: 36px; border-radius: 13px; background: var(--primary); color: var(--on-primary); display: grid; place-items: center; box-shadow: var(--shadow-pop); }
.tag { font: 800 10px/1 var(--font-body); letter-spacing: .07em; text-transform: uppercase; padding: 4px 8px; border-radius: 999px; background: var(--surface-2); color: var(--ink-3); }
.round { width: 42px; height: 42px; border: 0; border-radius: 50%; background: var(--surface); box-shadow: var(--shadow-soft); display: grid; place-items: center; color: var(--ink-2); transition: transform .3s var(--spring); flex: none; }
.round.sm { width: 36px; height: 36px; box-shadow: none; background: var(--surface-2); }
.round:active { transform: scale(.9); }
.push { margin-left: auto; }

.view { display: flex; flex-direction: column; gap: 14px; animation: rise .4s var(--spring); }
.stack { display: flex; flex-direction: column; gap: 14px; }
h1 { font: 600 26px/1.15 var(--font-display); margin: 0; text-wrap: balance; }
h2 { font: 600 18px/1.2 var(--font-display); margin: 0; }
.sub { color: var(--ink-3); font-size: 13.5px; font-weight: 700; margin: 0; }
.card { background: var(--surface); border-radius: 26px; padding: 16px; box-shadow: var(--shadow-soft); }

/* Beranda */
.hero { position: relative; overflow: hidden; background: color-mix(in oklab, var(--primary) 13%, var(--surface)); display: flex; flex-direction: column; gap: 14px; padding: 20px; }
.hero > * { position: relative; }
.hero .orn { position: absolute; right: -18px; bottom: -26px; width: 150px; height: 150px; color: var(--primary); opacity: .12; stroke-width: 1.6; }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.stat { display: flex; flex-direction: column; gap: 2px; }
.stat b { font: 600 32px/1 var(--font-display); font-variant-numeric: tabular-nums; }
.stat span { font-size: 12.5px; font-weight: 800; color: var(--ink-3); }
.row-card { display: flex; align-items: center; gap: 12px; padding: 12px 12px 12px 14px; }
.row-card .txt { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.row-card .txt b { font-weight: 800; }
.row-card .txt small { color: var(--ink-3); font-weight: 700; font-size: 12.5px; }
.ib { width: 40px; height: 40px; border-radius: 14px; display: grid; place-items: center; flex: none; background: color-mix(in oklab, var(--hue, var(--primary)) 15%, var(--surface)); color: color-mix(in oklab, var(--hue, var(--primary)) 70%, var(--ink)); }
.h-warn { --hue: var(--warn); }
.pill { border: 0; border-radius: 999px; padding: 9px 15px; background: var(--primary); color: var(--on-primary); font-weight: 800; font-size: 13px; flex: none; }

/* Tombol */
.btn-big { border: 0; border-radius: 20px; padding: 15px 18px; width: 100%; background: var(--primary); color: var(--on-primary); font: 600 17px/1 var(--font-display); display: flex; align-items: center; justify-content: center; gap: 8px; box-shadow: var(--shadow-pop); transition: transform .3s var(--spring), opacity .2s; }
.btn-big:active { transform: scale(.97); }
.btn-big:disabled { opacity: .6; cursor: progress; }
.btn-plain { border: 0; border-radius: 20px; padding: 15px 18px; background: var(--surface); color: var(--ink); font-weight: 800; box-shadow: var(--shadow-soft); }
.actions { display: grid; grid-template-columns: 1fr 2fr; gap: 10px; }

/* Nilai */
.steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.steps span { font-size: 12px; font-weight: 800; color: var(--ink-3); display: flex; flex-direction: column; gap: 6px; }
.steps span::before { content: ""; height: 6px; border-radius: 9px; background: var(--line); transition: background .3s; }
.steps span.on { color: var(--ink); }
.steps span.on::before { background: var(--primary); }
.meta { display: flex; flex-wrap: wrap; gap: 8px; }
.meta span { display: inline-flex; align-items: center; gap: 7px; background: var(--surface); border-radius: 999px; padding: 8px 13px; font-weight: 800; font-size: 13px; box-shadow: var(--shadow-soft); }
.meta .i { width: 16px; height: 16px; color: var(--ink-3); }
.form { display: flex; flex-direction: column; gap: 14px; }
.field { display: flex; flex-direction: column; gap: 7px; min-width: 0; }
.label { font-size: 12px; font-weight: 800; color: var(--ink-2); letter-spacing: .02em; }
.pair { display: grid; grid-template-columns: 1.25fr 1fr; gap: 8px; }
.input { width: 100%; min-width: 0; border: 0; border-radius: 16px; background: var(--surface-2); padding: 12px 14px; font-weight: 700; font-size: 15px; color: var(--ink); transition: box-shadow .2s; }
.input:focus { outline: none; box-shadow: inset 0 0 0 2px var(--primary); }
.input::placeholder { color: var(--ink-3); font-weight: 600; }
.dd-btn { display: flex; align-items: center; gap: 8px; text-align: left; cursor: pointer; }
.dd-btn .dd-val { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dd-btn .dd-val.ph { color: var(--ink-3); font-weight: 600; }
.dd-btn .i { width: 16px; height: 16px; color: var(--ink-3); transition: transform .25s var(--spring); }
.dd-btn[aria-expanded="true"] .i { transform: rotate(180deg); }
.dd-btn.input[aria-expanded="true"] { box-shadow: inset 0 0 0 2px var(--primary); }
.dd-pop { position: fixed; z-index: 80; background: var(--surface); border: 1px solid var(--line); border-radius: 20px; box-shadow: var(--shadow-big); padding: 6px; max-height: min(300px, 50vh); overflow: auto; display: flex; flex-direction: column; gap: 2px; animation: pop-in .22s var(--spring); transform-origin: top center; }
.dd-pop.up { transform-origin: bottom center; }
.dd-pop button { border: 0; background: none; border-radius: 14px; padding: 11px 12px; text-align: left; font-weight: 700; display: flex; align-items: center; justify-content: space-between; gap: 10px; color: var(--ink); flex: none; }
.dd-pop button:hover, .dd-pop button:focus-visible { background: var(--surface-2); outline: none; }
.dd-pop button[aria-selected="true"] { background: color-mix(in oklab, var(--primary) 12%, var(--surface)); color: color-mix(in oklab, var(--primary) 80%, var(--ink)); font-weight: 800; }
.dd-pop .i { width: 16px; height: 16px; }
.pick { display: flex; align-items: center; gap: 10px; text-align: left; }
.pick span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pick .ph { color: var(--ink-3); font-weight: 600; }
.pick .i { color: var(--ink-3); }
.miss { box-shadow: inset 0 0 0 2px var(--bad) !important; animation: shake .4s; }
.card.miss { box-shadow: 0 0 0 2px var(--bad), var(--shadow-soft) !important; }

.who { display: flex; align-items: center; gap: 10px; padding: 10px 14px 10px 10px; }
.who .av { width: 38px; height: 38px; }
.who div { display: flex; flex-direction: column; min-width: 0; }
.who b { font-weight: 800; }
.who small { color: var(--ink-3); font-weight: 700; font-size: 12.5px; }
.av { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; flex: none; background: color-mix(in oklab, var(--primary) 15%, var(--surface)); color: color-mix(in oklab, var(--primary) 75%, var(--ink)); font: 600 17px/1 var(--font-display); }

.sec { display: flex; flex-direction: column; gap: 12px; }
.s-situasi { --hue: var(--h-sit); } .s-tindakan { --hue: var(--h-tin); } .s-komunikasi { --hue: var(--h-kom); }
.sec-h { display: flex; align-items: center; gap: 10px; }
.sec-h .ib { width: 36px; height: 36px; border-radius: 12px; }
.ta { resize: vertical; min-height: 84px; line-height: 1.45; }
.photos { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.ph { position: relative; width: 68px; height: 68px; border-radius: 16px; overflow: hidden; flex: none; background: var(--surface-2); }
.ph img { width: 100%; height: 100%; object-fit: cover; display: block; }
.ph.add { border: 2px dashed var(--line); background: transparent; color: var(--ink-3); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 11.5px; font-weight: 800; transition: transform .3s var(--spring); }
.ph.add:active { transform: scale(.92); }
.ph.fake { display: grid; place-items: center; color: color-mix(in oklab, var(--hue, var(--primary)) 55%, var(--ink-3)); background: color-mix(in oklab, var(--hue, var(--primary)) 12%, var(--surface-2)); }
.ph .x { position: absolute; top: 4px; right: 4px; width: 22px; height: 22px; border: 0; border-radius: 50%; background: rgb(0 0 0 / .55); color: #FFFFFF; display: grid; place-items: center; padding: 0; }
.ph .x .i { width: 13px; height: 13px; stroke-width: 3; }
.cnt { font-size: 12px; font-weight: 800; color: var(--ink-3); }
.vbtns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.vbtn { border: 0; border-radius: 14px; padding: 10px; background: var(--surface-2); color: var(--ink-2); font-weight: 800; font-size: 13.5px; display: flex; align-items: center; justify-content: center; gap: 7px; font-variant-numeric: tabular-nums; transition: background .2s, transform .3s var(--spring); }
.vbtn:active { transform: scale(.95); }
.vbtn.on { background: color-mix(in oklab, var(--primary) 16%, var(--surface)); color: color-mix(in oklab, var(--primary) 80%, var(--ink)); }
.vbtn.on .i { animation: pulse 1s infinite; }
.vbtn.rec { background: color-mix(in oklab, var(--bad) 14%, var(--surface)); color: color-mix(in oklab, var(--bad) 80%, var(--ink)); }
.vbtn.rec .i { animation: blink 1s infinite; }
.clips { display: flex; flex-direction: column; gap: 6px; }
.clips:empty { display: none; }
.clip { display: flex; align-items: center; gap: 10px; background: var(--surface-2); border-radius: 14px; padding: 6px 6px 6px 6px; }
.clip b { font-size: 12.5px; font-weight: 800; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.play { width: 32px; height: 32px; border: 0; border-radius: 50%; background: var(--primary); color: var(--on-primary); display: grid; place-items: center; padding: 0; flex: none; }
.play .i { width: 15px; height: 15px; }
.wave { position: relative; flex: 1; height: 18px; background: repeating-linear-gradient(90deg, color-mix(in oklab, var(--ink-3) 55%, transparent) 0 3px, transparent 3px 6px); border-radius: 3px; overflow: hidden; }
.wave i { position: absolute; inset: 0 auto 0 0; width: 0; background: repeating-linear-gradient(90deg, var(--primary) 0 3px, transparent 3px 6px); }
.x2 { width: 30px; height: 30px; border: 0; border-radius: 50%; background: none; color: var(--ink-3); display: grid; place-items: center; padding: 0; }
.x2 .i { width: 16px; height: 16px; }
.txt { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.vchip { display: inline-flex; align-items: center; gap: 5px; padding: 5px 10px; border-radius: 999px; background: var(--surface-2); color: var(--ink-2); font-size: 12.5px; font-weight: 800; font-variant-numeric: tabular-nums; }
.vchip .i { width: 14px; height: 14px; }
dl { display: grid; grid-template-columns: auto 1fr; gap: 8px 16px; margin: 0; }
dt { color: var(--ink-3); font-weight: 800; font-size: 12.5px; padding-top: 1px; }
dd { margin: 0; font-weight: 800; min-width: 0; overflow-wrap: anywhere; }
dd em { font-style: normal; color: var(--ink-3); font-weight: 700; }

/* Riwayat */
.filters { display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 8px; margin: 0 -2px -6px; scrollbar-width: none; }
.fbtn { border: 0; border-radius: 999px; background: var(--surface); box-shadow: var(--shadow-soft); padding: 9px 12px 9px 14px; font-weight: 800; font-size: 13px; color: var(--ink-2); flex: none; }
.fbtn.set { background: color-mix(in oklab, var(--primary) 14%, var(--surface)); color: color-mix(in oklab, var(--primary) 80%, var(--ink)); }
.fbtn.set .i { color: inherit; }
.btn-out { border: 0; border-radius: 999px; padding: 9px 14px; background: var(--surface); box-shadow: var(--shadow-soft); font-weight: 800; font-size: 13px; display: inline-flex; align-items: center; gap: 6px; flex: none; }
.btn-out .i { width: 17px; height: 17px; }
.wait { color: color-mix(in oklab, var(--warn) 80%, var(--ink)); }
dd.wait { display: flex; align-items: center; gap: 6px; }
dd.wait .i { width: 17px; height: 17px; }

/* Akun */
.auth-hero { display: flex; flex-direction: column; align-items: center; gap: 12px; padding-block: 28px 6px; }
.auth-hero .mark { width: 68px; height: 68px; border-radius: 24px; }
.auth-hero .mark .i { width: 34px; height: 34px; }
.seg.full { display: grid; grid-template-columns: 1fr 1fr; }
.seg.full button { padding: 10px; font-size: 14px; }
.demo { display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 8px; }
.chipbtn { border: 0; border-radius: 999px; padding: 8px 14px; background: var(--surface); box-shadow: var(--shadow-soft); font-weight: 800; font-size: 13px; color: var(--ink-2); }
.stats.three { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.stats.three .stat { padding: 14px; }
.stats.three .stat b { font-size: 28px; }
.sec-title { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 6px; }
.acct { background: var(--surface-2); border-radius: 20px; }
.btn-soft.out { color: color-mix(in oklab, var(--bad) 75%, var(--ink)); }
.tabs .bar.two { grid-template-columns: repeat(2, 1fr); }
.title-row { display: flex; align-items: center; gap: 10px; }
.search { display: flex; align-items: center; gap: 8px; background: var(--surface); border-radius: 16px; padding: 0 14px; box-shadow: var(--shadow-soft); }
.search .i { color: var(--ink-3); width: 18px; height: 18px; }
.search input { flex: 1; min-width: 0; border: 0; background: none; padding: 12px 0; font-weight: 700; outline: none; }
.search.flat { box-shadow: none; background: var(--surface-2); }
.bar-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.seg { display: inline-flex; padding: 4px; gap: 2px; background: var(--surface-2); border-radius: 999px; }
.seg button { border: 0; background: transparent; padding: 6px 13px; border-radius: 999px; font-weight: 800; font-size: 13px; color: var(--ink-2); transition: background .2s, color .2s; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow-soft); }
.gh { font-size: 11.5px; font-weight: 900; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3); margin: 4px 4px -4px; }
.hlist { padding: 4px; }
.hrow { width: 100%; border: 0; background: none; display: flex; align-items: center; gap: 12px; padding: 10px; border-radius: 20px; text-align: left; transition: background .2s; }
.hrow:active { background: var(--surface-2); }
.hrow + .hrow { box-shadow: 0 -1px 0 var(--line); border-radius: 0 0 20px 20px; }
.hmain { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.hmain b { font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hmain b em { font-style: normal; color: var(--ink-3); font-weight: 700; font-size: 13px; }
.hmain small { color: var(--ink-3); font-weight: 700; font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hmeta { display: flex; gap: 8px; color: var(--ink-3); font-size: 12px; font-weight: 800; flex: none; }
.hmeta span { display: inline-flex; align-items: center; gap: 3px; }
.hmeta .i { width: 15px; height: 15px; }
.empty { text-align: center; color: var(--ink-3); font-weight: 700; padding: 28px 0; }

/* Tab bar */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; display: flex; justify-content: center; padding: 8px max(16px, env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); pointer-events: none; }
.tabs .bar { pointer-events: auto; width: 100%; max-width: 448px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; background: var(--surface); border-radius: 26px; box-shadow: var(--shadow-big); padding: 6px; }
.tabs button { border: 0; background: none; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 8px 4px; border-radius: 20px; font-weight: 800; font-size: 11.5px; color: var(--ink-3); transition: background .2s, color .2s, transform .3s var(--spring); }
.tabs button:active { transform: scale(.93); }
.tabs button[aria-current] { background: color-mix(in oklab, var(--primary) 13%, var(--surface)); color: color-mix(in oklab, var(--primary) 80%, var(--ink)); }

/* Lembar, toast, selesai */
.scrim { position: fixed; inset: 0; z-index: 45; background: var(--scrim); animation: fade .2s; }

.swatches { display: flex; gap: 10px; }

.swatches i { width: 28px; height: 28px; border-radius: 50%; background: var(--sw); }
.swatches button[aria-pressed="true"] { box-shadow: inset 0 0 0 2px var(--sw); color: var(--ink); }
.btn-soft { border: 0; border-radius: 18px; padding: 13px; background: var(--surface-2); font-weight: 800; display: flex; align-items: center; justify-content: center; gap: 8px; }
.ver { text-align: center; color: var(--ink-3); font-size: 12px; font-weight: 700; margin: 0; }
.toast { position: fixed; left: 50%; z-index: 60; transform: translateX(-50%); bottom: calc(100px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 11px 18px; border-radius: 999px; font-weight: 800; font-size: 13.5px; width: max-content; max-width: calc(100% - 32px); text-align: center; box-shadow: var(--shadow-soft); animation: toast .45s var(--spring); }

.burst { width: 96px; height: 96px; border-radius: 50%; background: var(--ok); color: var(--on-ok); display: grid; place-items: center; box-shadow: 0 16px 34px -10px color-mix(in oklab, var(--ok) 70%, transparent); animation: boing .6s var(--spring); }
.burst .i { width: 46px; height: 46px; stroke-width: 3; }

@keyframes rise { from { opacity: .4; transform: translateY(10px); } }
@keyframes up { from { transform: translateY(100%); } }
@keyframes fade { from { opacity: 0; } }
@keyframes toast { from { opacity: 0; transform: translate(-50%, 14px) scale(.9); } }

/* ---------- dropdown (bukan bawaan perangkat) ---------- */
const uniq = k => [...new Set(HIST.map(h => h[k]))].sort();
const DD = {
  aJab:  { ph: 'Jabatan', opts: () => JABATAN.map(j => [j, j]), get: () => S.aJab, set: v => { S.aJab = v; } },
  fJDin: { ph: 'Jabatan', opts: () => JABATAN.map(j => [j, j]), get: () => S.f.jdin, set: v => { S.f.jdin = v; } },
  fToko: { opts: () => [['', 'Semua toko'], ...uniq('toko').map(v => [v, v])], get: () => S.ft.toko, set: v => { S.ft.toko = v; renderRiwayat(); } },
  fPenF: { opts: () => [['', 'Semua penilai'], ...uniq('pen').map(v => [v, v])], get: () => S.ft.pen, set: v => { S.ft.pen = v; renderRiwayat(); } },
  fTgl:  { opts: () => [['all', 'Semua tanggal'], ['today', 'Hari ini'], ['7', '7 hari'], ['30', '30 hari']], get: () => S.ft.tgl, set: v => { S.ft.tgl = v; renderRiwayat(); } }
};
function ddPaint(key) {
  const c = DD[key], o = c.opts().find(x => x[0] === c.get()), val = $('#' + key + ' .dd-val');
  val.textContent = o ? o[1] : c.ph; val.classList.toggle('ph', !o);
}
let ddOpen = null;
function ddToggle(btn) {
  const key = btn.dataset.dd, was = ddOpen === key;
  ddClose(); if (was) return;
  const c = DD[key], v = c.get(), pop = $('#ddPop');
  pop.innerHTML = c.opts().map(([ov, l]) => `<button type="button" role="option" data-ddv="${esc(ov)}" aria-selected="${ov === v}">${esc(l)}${ov === v ? ICON('check') : ''}</button>`).join('');
  pop.hidden = false; ddOpen = key; btn.setAttribute('aria-expanded', 'true');
  const r = btn.getBoundingClientRect(), w = Math.max(r.width, 190), limit = innerHeight - ($('.tabs').hidden ? 12 : 96);
  pop.style.width = w + 'px';
  pop.style.left = Math.min(Math.max(12, r.left), innerWidth - w - 12) + 'px';
  const h = pop.offsetHeight, up = r.bottom + 6 + h > limit && r.top - 6 - h > 12;
  pop.classList.toggle('up', up);
  pop.style.top = (up ? r.top - 6 - h : r.bottom + 6) + 'px';
  (pop.querySelector('[aria-selected="true"]') || pop.firstElementChild).focus({ preventScroll: true });
}
function ddClose() {
  if (!ddOpen) return;
  $('#' + ddOpen).setAttribute('aria-expanded', 'false');
  $('#ddPop').hidden = true; ddOpen = null;
}
function ddPick(v) {
  const key = ddOpen, btn = $('#' + key);
  ddClose(); DD[key].set(v); ddPaint(key);
  btn.classList.remove('miss'); btn.focus({ preventScroll: true });
}

/* ---------- akun ---------- */

async function login(m) {
  const btn = $('#authBtn'); btn.disabled = true; await wait(450); btn.disabled = false;
  S.user = m; S.out = false;
  const last = HIST.find(h => h.pen === m.nama);
  S.f = { toko: last ? last.toko : '', din: '', jdin: '', at: new Date() };
  S.sec = fresh(); S.step = 1; S.q = ''; S.ft = { toko: '', pen: '', tgl: 'all' };

function logout() { closeSheet(); S.user = null; S.out = false; S.mode = 'in'; S.sec = fresh(); S.step = 1; go('auth'); }

/* ---------- navigasi ---------- */
function go(tab) {
  ddClose(); stopDikte(); stopRekam(true); stopPlay();
  if (!S.user) tab = 'auth';
  else if (tab === 'auth' || (tab === 'riwayat' && S.user.role !== 'Admin')) tab = 'home';
  S.tab = tab;
  const auth = tab === 'auth';
  $$('.view').forEach(v => v.hidden = v.id !== 'v-' + tab);
  $('.top').hidden = auth; $('.tabs').hidden = auth;
  $$('.tabs button').forEach(b => b.dataset.tab === tab ? b.setAttribute('aria-current', 'page') : b.removeAttribute('aria-current'));
  if (auth) renderAuth();
  if (tab === 'home') renderHome();
  if (tab === 'nilai') setStep(S.step);
  if (tab === 'riwayat') renderRiwayat();
  window.scrollTo(0, 0);
}
const hasDraft = () => !!S.f.din || Object.values(S.sec).some(s => s.text.trim() || s.photos.length || s.clips.length);
const weekStart = () => { const d = new Date(); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() - (d.getDay() + 6) % 7); return d; };
const mine = () => [...S.queue.filter(r => r.pen === S.user.nama).map(r => ({ ...r, wait: true })), ...HIST.filter(h => h.pen === S.user.nama)].sort((a, b) => b.at - a.at);

function renderHome() {
  const list = mine(), today = new Date(), ws = weekStart();
  $('#hName').textContent = S.user.nama;
  $('#hDate').textContent = fmtDate(today, { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
  $('#stToday').textContent = list.filter(r => sameDay(r.at, today)).length;
  $('#stWeek').textContent = list.filter(r => r.at >= ws).length;
  $('#stAll').textContent = list.length;
  $('#draftCard').hidden = !hasDraft();
  $('#draftSub').textContent = S.f.din ? `${S.f.din}${S.f.jdin ? ' · ' + S.f.jdin : ''}` : 'Belum selesai';
  $('#sendNow').hidden = !list.some(r => r.wait);
  $('#myList').innerHTML = list.length ? groupHtml(list, false) : `<p class="empty">Belum ada penilaian</p>`;
}

/* ---------- daftar riwayat ---------- */
function dayLabel(d) {
  const t = new Date(), y = new Date(t); y.setDate(t.getDate() - 1);
  if (sameDay(d, t)) return 'Hari ini';
  if (sameDay(d, y)) return 'Kemarin';
  return fmtDate(d, { weekday: 'long', day: 'numeric', month: 'short' });
}
function rowHtml(h, showPen) {
  const foto = Object.values(h.sec).reduce((a, s) => a + (s.photos.length || s.n || 0), 0);
  const suara = Object.values(h.sec).reduce((a, s) => a + s.clips.length, 0);
  return `<button type="button" class="hrow" data-h="${h.id}"><span class="av">${initial(h.din)}</span>
    <span class="hmain"><b>${esc(h.din)} <em>${esc(h.jdin)}</em></b><small>${esc(h.toko)} · ${fmtTime(h.at)}${showPen ? ' · ' + esc(h.pen) : ''}</small></span>
    <span class="hmeta">${h.wait ? `<span class="wait" title="Menunggu kirim" aria-label="Menunggu kirim">${ICON('cloud')}</span>` : ''}${foto ? `<span>${ICON('img')}${foto}</span>` : ''}${suara ? `<span>${ICON('mic')}${suara}</span>` : ''}</span></button>`;
}
function groupHtml(list, showPen) {
  const groups = [];
  list.forEach(h => { const l = dayLabel(h.at), g = groups.find(x => x.l === l); g ? g.items.push(h) : groups.push({ l, items: [h] }); });
  return groups.map(g => `<p class="gh">${g.l}</p><div class="card hlist">${g.items.map(h => rowHtml(h, showPen)).join('')}</div>`).join('');
}
function renderRiwayat() {
  ['fToko', 'fPenF', 'fTgl'].forEach(ddPaint);
  $('#fToko').classList.toggle('set', !!S.ft.toko);
  $('#fPenF').classList.toggle('set', !!S.ft.pen);
  $('#fTgl').classList.toggle('set', S.ft.tgl !== 'all');
  const q = S.q.trim().toLowerCase(), t0 = new Date(); t0.setHours(0, 0, 0, 0);
  const since = S.ft.tgl === 'all' ? null : S.ft.tgl === 'today' ? t0 : new Date(t0 - (S.ft.tgl - 1) * 864e5);
  const list = HIST.filter(h => (!q || [h.din, h.toko, h.pen].join(' ').toLowerCase().includes(q))
    && (!S.ft.toko || h.toko === S.ft.toko) && (!S.ft.pen || h.pen === S.ft.pen) && (!since || h.at >= since));
  $('#histCount').textContent = `${list.length} penilaian`;
  $('#histList').innerHTML = list.length ? groupHtml(list, true) : `<p class="empty">Tidak ada yang cocok</p>`;
}
function openDetail(id) {
  const q = S.queue.find(x => x.id === id), h = q || HIST.find(x => x.id === id);
  if (!h) return;
  openSheet(`<div class="sheet-head"><div class="who" style="padding:0"><span class="av">${initial(h.din)}</span><div><b>${esc(h.din)}</b><small>${esc(h.jdin)}</small></div></div><button type="button" class="round sm" data-close aria-label="Tutup">${ICON('x')}</button></div>
    <dl>${metaRows(h)}${q ? `<dt>Status</dt><dd class="wait">${ICON('cloud')}Menunggu kirim</dd>` : ''}</dl>${secCards(h.sec)}`);
}
async function sendQueue(btn) {
  btn.disabled = true; btn.textContent = 'Mengirim…';
  await wait(800);
  HIST.unshift(...S.queue.filter(r => r.pen === S.user.nama));
  HIST.sort((a, b) => b.at - a.at);
  S.queue = S.queue.filter(r => r.pen !== S.user.nama);
  btn.disabled = false; btn.textContent = 'Kirim sekarang';
  renderHome(); toast('Terkirim');
}

/* ---------- nilai ---------- */
function setStep(n) {
  if (n !== 2) { stopDikte(); stopRekam(true); stopPlay(); }
  S.step = n;
  ['s1', 's2', 's3'].forEach((id, i) => $('#' + id).hidden = i + 1 !== n);
  $$('#steps span').forEach((s, i) => s.classList.toggle('on', i < n));
  if (n === 1) renderS1();
  if (n === 2) renderS2();
  if (n === 3) renderS3();
  window.scrollTo(0, 0);
}
function renderS1() {
  if (!hasDraft()) S.f.at = new Date();
  $('#mDate').textContent = fmtDate(S.f.at);
  $('#mTime').textContent = fmtTime(S.f.at);
  $('#mPen').textContent = S.user.nama;
  const tv = $('#tokoVal');
  tv.textContent = S.f.toko || 'Pilih toko';
  tv.className = S.f.toko ? '' : 'ph';
  $('#fDin').value = S.f.din; ddPaint('fJDin');
  $('#dlNama').innerHTML = S.names.map(n => `<option value="${esc(n)}"></option>`).join('');
}
function checkS1() {
  const need = [['toko', '#tokoBtn', 'Pilih toko dulu'], ['din', '#fDin', 'Isi nama yang dinilai'], ['jdin', '#fJDin', 'Pilih jabatan yang dinilai']];
  for (const [k, sel, msg] of need) if (!String(S.f[k]).trim()) { flag($(sel)); return toast(msg); }
  setStep(2);
}
const secHead = k => `<div class="sec-h"><span class="ib">${ICON(SEC[k].ic)}</span><h2>${SEC[k].label}</h2></div>`;
function buildSecs() {
  $('#secs').innerHTML = Object.keys(SEC).map(k => `
    <div class="card sec s-${k}" id="sec-${k}">
      ${secHead(k)}
      ${SEC[k].photo ? `<div class="photos" data-sec="${k}"></div>` : ''}

function renderS2() {
  $('#whoChip').innerHTML = `<span class="av">${initial(S.f.din)}</span><div><b>${esc(S.f.din)}</b><small>${esc(S.f.jdin)} · ${esc(S.f.toko)}</small></div>`;
  Object.keys(SEC).forEach(k => { $('#t-' + k).value = S.sec[k].text; renderPhotos(k); renderClips(k); });
}
function renderPhotos(k) {
  const el = $(`.photos[data-sec="${k}"]`); if (!el) return;
  const ps = S.sec[k].photos;
  el.innerHTML = ps.map((p, i) => `<div class="ph"><img src="${p}" alt="Foto ${i + 1}"><button type="button" class="x" data-delp="${k}:${i}" aria-label="Hapus foto">${ICON('x')}</button></div>`).join('')
    + `<button type="button" class="ph add" data-addp="${k}" aria-label="Tambah foto">${ICON('cam')}<span>Foto</span></button>`
    + (ps.length ? `<span class="cnt">${ps.length} foto</span>` : '');
}
function renderClips(k) {
  $(`[data-clips="${k}"]`).innerHTML = S.sec[k].clips.map((c, i) => `<div class="clip"><button type="button" class="play" data-play="${k}:${i}" aria-label="Putar rekaman">${ICON('play')}</button><div class="wave"><i></i></div><b>${fmtDur(c)}</b><button type="button" class="x2" data-delc="${k}:${i}" aria-label="Hapus rekaman">${ICON('x')}</button></div>`).join('');
}
function checkS2() {
  stopDikte(); stopRekam(true);
  for (const k of Object.keys(SEC)) {
    const s = S.sec[k];
    if (!s.text.trim() && !s.clips.length) {
      const card = $('#sec-' + k); flag(card);
      card.scrollIntoView({ behavior: 'smooth', block: 'center' }); return toast(`Isi ${SEC[k].label} dulu`);
    }
  }
  setStep(3);
}
const secCards = o => Object.keys(SEC).map(k => {
  const s = o[k], n = s.photos.length || s.n || 0;
  const ph = n ? `<div class="photos">${s.photos.length ? s.photos.map(p => `<div class="ph"><img src="${p}" alt=""></div>`).join('') : Array.from({ length: n }, () => `<div class="ph fake">${ICON('img')}</div>`).join('')}</div>` : '';
  const cl = s.clips.length ? `<div class="chips">${s.clips.map(c => `<span class="vchip">${ICON('mic')}${fmtDur(c)}</span>`).join('')}</div>` : '';
  return `<div class="card sec s-${k}">${secHead(k)}${ph}${s.text.trim() ? `<p class="txt">${esc(s.text.trim())}</p>` : ''}${cl}</div>`;
}).join('');
const metaRows = r => `
  <dt>Toko</dt><dd>${esc(r.toko)}</dd>
  <dt>Waktu</dt><dd>${fmtDate(r.at)} · ${fmtTime(r.at)}</dd>
  <dt>Penilai</dt><dd>${esc(r.pen)} <em>${esc(r.jpen)}</em></dd>
  <dt>Dinilai</dt><dd>${esc(r.din)} <em>${esc(r.jdin)}</em></dd>`;
function renderS3() {
  $('#sumHead').innerHTML = metaRows({ ...S.f, pen: S.user.nama, jpen: S.user.jab });
  $('#sumBody').innerHTML = secCards(S.sec);
}
async function kirim(btn) {
  btn.disabled = true; btn.querySelector('span').textContent = 'Mengirim…';
  await wait(900);
  const rec = { id: 'h' + (++hid), ...S.f, pen: S.user.nama, jpen: S.user.jab, sec: S.sec };
  const online = navigator.onLine !== false;
  if (online) HIST.unshift(rec); else S.queue.push(rec);
  if (!S.names.includes(S.f.din)) S.names.push(S.f.din);
  S.f = { toko: S.f.toko, din: '', jdin: '', at: new Date() };
  S.sec = fresh(); S.step = 1;
  btn.disabled = false; btn.querySelector('span').textContent = 'Kirim';
  if (online) {
    $('#doneSub').textContent = `${rec.din} · ${fmtTime(rec.at)}`;
    $('#done').hidden = false;
    await wait(1500);
    $('#done').hidden = true;
  } else toast('Tersimpan. Terkirim saat online');
  go('home');
}

/* ---------- foto & suara (disimulasikan di mockup) ---------- */
function pickPhoto(k) {
  S.pk = k;
  openSheet(`<div class="sheet-head"><h2>Tambah foto</h2><button type="button" class="round sm" data-close aria-label="Tutup">${ICON('x')}</button></div>
    <div class="opts">
      <button type="button" class="opt" data-src="cam"><span class="ib">${ICON('cam')}</span>Kamera</button>

    </div>`);

function onFiles(e) {
  const files = [...e.target.files]; e.target.value = '';
  if (!files.length || !S.pk) return;
  files.forEach(f => S.sec[S.pk].photos.push(URL.createObjectURL(f)));
  renderPhotos(S.pk);
  toast(files.length > 1 ? `${files.length} foto ditambahkan` : 'Foto ditambahkan');
}
let dk = null, rk = null, pl = null;
function toggleDikte(k, btn) {
  const same = dk && dk.k === k;
  stopDikte(); if (same) return;
  stopRekam(true);
  const ta = $('#t-' + k), words = SEC[k].demo.split(' '), base = ta.value.trim() ? ta.value.trimEnd() + ' ' : '';
  let i = 0;
  btn.classList.add('on'); btn.querySelector('span').textContent = 'Berhenti';
  dk = { k, btn, timer: setInterval(() => {
    if (i >= words.length) return stopDikte();
    ta.value = base + words.slice(0, ++i).join(' ');
    S.sec[k].text = ta.value; $('#sec-' + k).classList.remove('miss');
  }, 260) };
}
function stopDikte() {
  if (!dk) return;
  clearInterval(dk.timer); dk.btn.classList.remove('on'); dk.btn.querySelector('span').textContent = 'Dikte'; dk = null;
}
function toggleRekam(k, btn) {
  const same = rk && rk.k === k;
  stopRekam(true); if (same) return;
  stopDikte();
  const t0 = Date.now(), lbl = btn.querySelector('span'), max = fmtDur(MAX_REKAM);
  btn.classList.add('rec'); lbl.textContent = `0:00 / ${max}`;
  rk = { k, btn, t0, timer: setInterval(() => {
    const s = (Date.now() - t0) / 1000;
    if (s >= MAX_REKAM) { stopRekam(true); return toast('Rekaman maksimal 1 menit'); }
    lbl.textContent = `${fmtDur(Math.floor(s))} / ${max}`;
  }, 250) };
}
function stopRekam(save) {
  if (!rk) return;
  clearInterval(rk.timer);
  const d = Math.min(MAX_REKAM, Math.max(1, Math.round((Date.now() - rk.t0) / 1000))), k = rk.k;
  rk.btn.classList.remove('rec'); rk.btn.querySelector('span').textContent = 'Rekam'; rk = null;
  if (save) { S.sec[k].clips.push(d); renderClips(k); $('#sec-' + k).classList.remove('miss'); }
}
function stopPlay() {
  if (!pl) return;
  clearTimeout(pl.t); pl.bar.style.transition = 'none'; pl.bar.style.width = '0'; pl.btn.innerHTML = ICON('play'); pl = null;
}
function play(btn, key) {
  const same = pl && pl.btn === btn;
  stopPlay(); if (same) return;
  const [k, i] = key.split(':'), d = S.sec[k].clips[+i], bar = btn.parentElement.querySelector('.wave i');
  bar.style.transition = 'none'; bar.style.width = '0'; void bar.offsetWidth;
  bar.style.transition = `width ${d}s linear`; bar.style.width = '100%';
  btn.innerHTML = ICON('pause');
  pl = { btn, bar, t: setTimeout(stopPlay, d * 1000) };
}

/* ---------- pengaturan ---------- */
function openSettings() {
  const u = S.user; S.out = false;
  openSheet(`<div class="sheet-head"><h2>Pengaturan</h2><button type="button" class="round sm" data-close aria-label="Tutup">${ICON('x')}</button></div>
    <div class="who acct"><span class="av">${initial(u.nama)}</span><div><b>${esc(u.nama)}</b><small>${esc(u.jab)} · ${u.role}</small></div></div>
    <div class="field"><span class="label">Warna</span><div class="swatches">${['mint', 'lavender', 'peach'].map(p => `<button type="button" data-pal="${p}" style="--sw:var(--sw-${p})" aria-pressed="${S.pal === p}"><i></i>${p[0].toUpperCase() + p.slice(1)}</button>`).join('')}</div></div>
    <div class="field"><span class="label">Tema</span><div class="seg">${[['light', 'Terang'], ['dark', 'Gelap'], ['auto', 'Otomatis']].map(([v, l]) => `<button type="button" data-th="${v}" aria-pressed="${S.theme === v}">${l}</button>`).join('')}</div></div>
    <button type="button" class="btn-soft" id="installBtn">${ICON('dl')}Install aplikasi</button>
    <button type="button" class="btn-soft out" id="outBtn">${ICON('out')}<span>Keluar</span></button>
    <p class="ver">ComHost · mockup</p>`);
}

/* ---------- lembar & toast ---------- */
function openSheet(html) { ddClose(); $('#sheetBody').innerHTML = html; $('#scrim').hidden = false; $('#sheet').hidden = false; }
function closeSheet() { $('#scrim').hidden = true; $('#sheet').hidden = true; }
let tt;
function toast(msg) { const t = $('#toast'); t.hidden = true; void t.offsetWidth; t.textContent = msg; t.hidden = false; clearTimeout(tt); tt = setTimeout(() => t.hidden = true, 2200); }
function tokoSheet() {
  openSheet(`<div class="sheet-head"><h2>Toko</h2><button type="button" class="round sm" data-close aria-label="Tutup">${ICON('x')}</button></div>
    <label class="search flat">${ICON('search')}<input id="tokoQ" placeholder="Cari toko" autocomplete="off"></label>
    <div class="tlist" id="tlist"></div>`);
  const draw = q => $('#tlist').innerHTML = TOKO.filter(t => t.toLowerCase().includes(q.toLowerCase())).map(t => `<button type="button" data-toko="${esc(t)}" aria-selected="${t === S.f.toko}">${esc(t)}${t === S.f.toko ? ICON('check') : ''}</button>`).join('') || `<p class="empty">Toko tidak ditemukan</p>`;
  draw('');
  $('#tokoQ').addEventListener('input', e => draw(e.target.value));
}

/* ---------- event ---------- */
document.addEventListener('click', e => {
  if (ddOpen && !e.target.closest('#ddPop, [data-dd]')) ddClose();
  const t = e.target.closest('button'); if (!t) return;
  const d = t.dataset;
  if ('ddv' in d) return ddPick(d.ddv);
  if (d.dd) return ddToggle(t);
  if (d.am) { S.mode = d.am; return renderAuth(); }
  if (d.demo) return login(MEMBERS.find(m => m.nama === d.demo));
  if (d.tab) return go(d.tab);
  if (d.go) return go(d.go);
  if ('close' in d) return closeSheet();
  if (d.step) return setStep(+d.step);
  if (d.addp) return pickPhoto(d.addp);
  if (d.src) { closeSheet(); return $(d.src === 'cam' ? '#fCam' : '#fGal').click(); }
  if (d.delp) { const [k, i] = d.delp.split(':'); S.sec[k].photos.splice(+i, 1); return renderPhotos(k); }
  if (d.delc) { stopPlay(); const [k, i] = d.delc.split(':'); S.sec[k].clips.splice(+i, 1); return renderClips(k); }
  if (d.play) return play(t, d.play);
  if (d.dikte) return toggleDikte(d.dikte, t);
  if (d.rekam) return toggleRekam(d.rekam, t);
  if (d.toko) { S.f.toko = d.toko; closeSheet(); $('#tokoBtn').classList.remove('miss'); return renderS1(); }
  if (d.h) return openDetail(d.h);
  if (d.pal) { S.pal = d.pal; document.documentElement.dataset.palette = d.pal; $$('[data-pal]').forEach(b => b.setAttribute('aria-pressed', b.dataset.pal === d.pal)); return; }
  if (d.th) { S.theme = d.th; d.th === 'auto' ? delete document.documentElement.dataset.theme : document.documentElement.dataset.theme = d.th; $$('[data-th]').forEach(b => b.setAttribute('aria-pressed', b.dataset.th === d.th)); return; }
  switch (t.id) {
    case 'setBtn': return openSettings();
    case 'tokoBtn': return tokoSheet();
    case 'toS2': return checkS1();
    case 'toS3': return checkS2();
    case 'kirim': return kirim(t);
    case 'sendNow': return sendQueue(t);
    case 'xlsBtn': return toast('Di app asli: file Excel terunduh');
    case 'installBtn': return toast('Di app asli: pasang ke layar utama');
    case 'outBtn':
      if (!S.out) { S.out = true; t.querySelector('span').textContent = 'Yakin keluar?'; return; }
      return logout();
  }
});
document.addEventListener('input', e => {
  const el = e.target;
  if (el.dataset.k) { S.sec[el.dataset.k].text = el.value; $('#sec-' + el.dataset.k).classList.remove('miss'); return; }
  if (el.id === 'fDin') { S.f.din = el.value; el.classList.remove('miss'); return; }
  if (el.id === 'aNama' || el.id === 'aKode') return el.classList.remove('miss');
  if (el.id === 'fCari') { S.q = el.value; renderRiwayat(); }
});
$('#authForm').addEventListener('submit', e => {
  e.preventDefault();
  const nama = $('#aNama').value.trim(), jab = S.aJab, kode = $('#aKode').value;
  const bad = (sel, msg) => { flag($(sel)); toast(msg); };
  if (!nama) return bad('#aNama', 'Isi nama');
  const ada = MEMBERS.find(m => m.nama.toLowerCase() === nama.toLowerCase());
  if (S.mode === 'new') {
    if (ada) return bad('#aNama', 'Nama sudah dipakai');
    if (!jab) return bad('#aJab', 'Pilih jabatan');
    if (kode.length < 4) return bad('#aKode', 'Kode minimal 4 karakter');
    const m = { nama, jab, kode, role: 'Member' };
    MEMBERS.push(m); login(m);
  } else {
    if (!ada || ada.kode !== kode) return bad('#aKode', 'Nama atau kode salah');
    login(ada);
  }
});
$('#scrim').addEventListener('click', closeSheet);
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if (ddOpen) { const b = $('#' + ddOpen); ddClose(); return b.focus(); } return closeSheet(); }
  if (ddOpen && (e.key === 'ArrowDown' || e.key === 'ArrowUp')) {
    e.preventDefault();
    const b = $$('#ddPop button'), i = b.indexOf(document.activeElement);
    b[(i + (e.key === 'ArrowDown' ? 1 : -1) + b.length) % b.length].focus();
  }
});
addEventListener('scroll', e => { if (!(e.target.closest && e.target.closest('#ddPop'))) ddClose(); }, true);
addEventListener('resize', ddClose);
$('#fCam').addEventListener('change', onFiles);
$('#fGal').addEventListener('change', onFiles);

/* ---------- mulai ---------- */
HIST.sort((a, b) => b.at - a.at);
buildSecs();
go('auth');
</script>
